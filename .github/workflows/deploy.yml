name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Python setup ──
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.x"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install Python dependencies
        run: uv sync --frozen

      # ── Download pre-built database from GitHub Release ──
      - name: Download database from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/db
          gh release download data-v0.1.0 \
            --repo ${{ github.repository }} \
            --pattern "ims_games.sqlite.tar.gz" \
            --dir data/db/ \
            --clobber || {
            echo "ERROR: Could not download database from release data-v0.1.0"
            echo "Make sure the release exists with the ims_games.sqlite.tar.gz asset."
            echo "Create it with: tar -czf ims_games.sqlite.tar.gz -C data/db ims_games.sqlite"
            exit 1
          }
          tar -xzf data/db/ims_games.sqlite.tar.gz -C data/db
          ls -lh data/db/ims_games.sqlite

      - name: Export static JSON
        run: uv run python scripts/export_static_json.py

      # ── Bun / Astro build ──
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Bun dependencies
        working-directory: site
        run: bun install --frozen-lockfile

      - name: Build Astro site
        working-directory: site
        run: bun run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
