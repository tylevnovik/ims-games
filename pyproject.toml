[project]
name = "ims-games"
version = "0.1.0"
description = "IMS Games - Transparent Game Score Aggregator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "rapidfuzz>=3.0",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pyarrow>=14.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
